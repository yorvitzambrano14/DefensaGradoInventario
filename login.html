<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* 🎨 LOGIN ULTRA MODERNO */
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            --p-g:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            --sc-g:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
            --glass:hsla(0,0%,100%,.15);
            --glass-b:rgba(255,255,255,.3);
            --sh:0 20px 60px rgba(0,0,0,.3);
            --t:all .4s cubic-bezier(.4,0,.2,1)
        }
        body{
            font-family:system-ui,-apple-system,sans-serif;
            height:100vh;
            background:
                url('/assets/img/img2.jpg') center/cover no-repeat fixed,
                linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%);
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;position:relative
        }
        body::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 80%,rgba(120,119,198,.3),transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,119,198,.3),transparent 50%);animation:pulse 4s ease-in-out infinite alternate}
        @keyframes pulse{0%{opacity:.6}100%{opacity:1}}
        .login-container{
            background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--glass-b);
            border-radius:2.5rem;padding:3.5rem 3rem;width:100%;max-width:420px;
            box-shadow:var(--sh);text-align:center;position:relative;overflow:hidden
        }
        .login-container::before{
            content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--p-g)
        }
        .login-logo{width:100px;height:auto;margin:0 auto 2rem;display:block;filter:drop-shadow(0 10px 30px rgba(102,126,234,.5))}
        .login-title{margin-bottom:1rem;font-size:2.2rem;font-weight:900;background:var(--p-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .login-subtitle{margin-bottom:2.5rem;color:hsla(0,0%,100%,.8);font-size:1.1rem;font-weight:500}
        
        .form-group{margin-bottom:1.75rem;position:relative;text-align:left}
        .form-group label{display:block;margin-bottom:.5rem;font-weight:600;color:#fff;font-size:.95rem}
        .form-group input{width:100%;padding:1.25rem 1.5rem;border:2px solid transparent;border-radius:1.25rem;background:hsla(0,0%,100%,.12);backdrop-filter:blur(15px);color:#fff;font-size:1.1rem;transition:var(--t);font-family:inherit}
        .form-group input::placeholder{color:hsla(0,0%,100%,.5)}
        .form-group input:focus{outline:none;border-color:#667eea;background:hsla(0,0%,100%,.2);box-shadow:0 0 0 .3rem rgba(102,126,234,.25);transform:translateY(-2px)}
        
        .login-btn{width:100%;background:var(--sc-g);border:none;border-radius:1.25rem;padding:1.25rem;font-size:1.15rem;font-weight:700;color:#fff;cursor:pointer;transition:var(--t);box-shadow:var(--sh);position:relative;overflow:hidden}
        .login-btn:hover{transform:translateY(-4px);box-shadow:0 25px 70px rgba(79,172,254,.6)}
        .login-btn:active{transform:translateY(-2px)}
        
        .login-footer{margin-top:2rem;padding-top:1.5rem;border-top:1px solid hsla(0,0%,100%,.2)}
        .login-footer p{color:hsla(0,0%,100%,.7);font-size:.9rem}
        
        .error-msg{color:#ef4444;background:hsla(0,0%,100%,.1);border:1px solid rgba(239,68,68,.3);border-radius:.75rem;padding:1rem;margin-bottom:1.5rem;font-size:.95rem;display:none}
        
        @media(max-width:480px){
            .login-container{padding:2.5rem 2rem;max-width:95%}
            .login-title{font-size:1.9rem}
            body::before{display:none}
        }
        
        .loading{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:3px solid hsla(0,0%,100%,.3);border-top:3px solid #fff;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo SVG por defecto o imagen -->
        <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>

        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

        <!-- Mensaje de Error -->
        <div id="errorMessage" class="error-msg"></div>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" placeholder="tu@email.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                <span class="btn-text">Iniciar Sesión</span>
                <div class="loading" id="loadingSpinner"></div>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </div>

    <!-- Script principal -->
    <script src="login.js"></script>
</body>
</html>
